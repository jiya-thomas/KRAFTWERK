services:
  swiss-pm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiss-project-manager
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - DATABASE_URL=/app/data/projects.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
